name: vibe_app
description: "A revolutionary communication app for the Deaf and Speech Impaired."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  intl: ^0.19.0
  font_awesome_flutter: ^10.7.0

  # Profile & Classy UI
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  flutter_blurhash: ^0.8.2

  # Multi-User & Group Rooms
  flutter_blue_plus: ^1.31.0
  share_plus: ^9.0.0

  # AI & Vision (2026 Stable Unified Suite)
  # google_ml_kit is the "umbrella" that now includes the latest vision features
  google_ml_kit: ^0.21.0
  google_mlkit_commons: ^0.11.1
  # Using Pose Detection for stable hand/arm tracking in 2026
  google_mlkit_pose_detection: ^0.14.1
  google_mlkit_object_detection: ^0.15.0

  # Media & Output
  video_player: ^2.8.1
  flutter_tts: ^4.2.2
  vibration: ^2.0.1

  # Camera & Permissions
  camera: ^0.11.0
  permission_handler: ^11.0.0

  # Real-time Communication (Streaming)
  web_socket_channel: ^3.0.1

  # Offline Mode & Local Intelligence
  tflite_flutter: ^0.10.1
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0

  # Network & Syncing
  connectivity_plus: ^6.0.3
  sqflite_common_ffi: ^2.3.5
  sqflite_common_ffi_web: ^0.4.3+1
  speech_to_text: ^6.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vibe_model_quant.tflite
